    <path id="Rr1" d="M1216 204 L1162 146 L1214 84 L1104 64 L1024 122" fill="none" stroke="none"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffc46b" filter="url(#bloom-sm)"><animateMotion dur="3.9s" repeatCount="indefinite" rotate="0"><mpath xlink:href="#Rr1" href="#Rr1"/></animateMotion></rect>
    <path id="Rr2" d="M1078 194 L1024 122 L1104 64 L1214 84" fill="none" stroke="none"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffc46b" filter="url(#bloom-sm)"><animateMotion dur="5.2s" repeatCount="indefinite" rotate="0"><mpath xlink:href="#Rr2" href="#Rr2"/></animateMotion></rect>

    <!-- headline -->
    <text x="640.0" y="112" text-anchor="middle" class="t" font-size="17" font-weight="600" fill="#ffb347" fill-opacity=".7" textLength="430" lengthAdjust="spacingAndGlyphs">UNOFFICIAL · COMMUNITY · HUB</text>
    <text x="640.0" y="210" text-anchor="middle" class="t" font-size="104" font-weight="800" fill="#ffb347" filter="url(#bloom)" textLength="660" lengthAdjust="spacingAndGlyphs">FLIPPER ONE</text>
    <text x="626.0" y="262" text-anchor="middle" class="t" font-size="22" fill="#ffd9a0" fill-opacity=".9" textLength="700" lengthAdjust="spacingAndGlyphs">&gt; specs · launch timeline · everything people build</text>
    <rect class="cursor" x="984.0" y="244" width="12" height="22" fill="#ffb347"/>

    <!-- spec chips -->
    <rect x="192.4" y="292" width="185.6" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="285.2" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="153.6" lengthAdjust="spacingAndGlyphs">RK3576 · 8 CORES</text><rect x="390.0" y="292" width="128.0" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="454.0" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="96.0" lengthAdjust="spacingAndGlyphs">6 TOPS NPU</text><rect x="530.0" y="292" width="108.8" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="584.4" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="76.8" lengthAdjust="spacingAndGlyphs">WI-FI 6E</text><rect x="650.8" y="292" width="128.0" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="714.8" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="96.0" lengthAdjust="spacingAndGlyphs">2× GIGABIT</text><rect x="790.8" y="292" width="118.4" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="850.0" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="86.4" lengthAdjust="spacingAndGlyphs">M.2 KEY-B</text><rect x="921.2" y="292" width="166.4" height="36" rx="6" fill="#ffb347" fill-opacity=".06" stroke="#ffb347" stroke-opacity=".55" stroke-width="1.5"/><text x="1004.4" y="316" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#ffd9a0" textLength="134.4" lengthAdjust="spacingAndGlyphs">MAINLINE LINUX</text>

    <!-- hype meter -->
    <text x="56" y="371" class="t" font-size="14" font-weight="700" fill="#ffb347" fill-opacity=".75" textLength="44" lengthAdjust="spacingAndGlyphs">HYPE</text>
    <rect x="112" y="360" width="224" height="12" fill="#ffb347" fill-opacity=".14" mask="url(#segs)"/>
    <rect x="112" y="360" width="0" height="12" fill="#ffb347" mask="url(#segs)">
      <animate attributeName="width" values="0;14;28;42;56;70;84;98;112;126;140;154;168;182;196;210;224;224;224;224;224" keyTimes="0.0000;0.0500;0.1000;0.1500;0.2000;0.2500;0.3000;0.3500;0.4000;0.4500;0.5000;0.5500;0.6000;0.6500;0.7000;0.7500;0.8000;0.8500;0.9000;0.9500;1.0000" calcMode="discrete" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <text x="346" y="371" class="t" font-size="14" font-weight="700" fill="#ffb347" fill-opacity=".75">MAX</text>
    <text x="1224" y="371" text-anchor="end" class="t" font-size="14" fill="#ffb347" fill-opacity=".5">github.com/haxdoggy/Flipper-One</text>

    <!-- CRT feel -->
    <rect class="sweep" x="0" y="0" width="1280" height="140" fill="url(#band)"/>
    <rect width="1280" height="400" fill="url(#scan)" opacity=".35"/>

    <!-- viewfinder corners -->
    <g fill="none" stroke="#ffb347" stroke-opacity=".55" stroke-width="3">
      <path d="M22 62V22h40"/><path d="M1218 22h40v40"/><path d="M22 338v40h40"/><path d="M1218 378h40v-40"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="398.5" rx="17.5" fill="none" stroke="#ffb347" stroke-opacity=".22" stroke-width="1.5"/>
