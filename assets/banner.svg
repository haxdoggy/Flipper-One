<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Flipper One — unofficial community hub</title>
  <desc id="desc">Banner for an unofficial, community-maintained hub with Flipper One specs, the launch timeline and community projects.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="2" height="2" fill="#ffb347" fill-opacity=".07"/></pattern>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".5"/></pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="62%"><stop offset="0" stop-color="#ff9a2e" stop-opacity=".20"/><stop offset=".55" stop-color="#ff9a2e" stop-opacity=".05"/><stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/></radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset=".5" stop-color="#ffb347" stop-opacity=".09"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
    <filter id="bloom" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom-sm" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>
    <mask id="segs"><rect x="112" y="360" width="10" height="12" fill="#fff"/><rect x="126" y="360" width="10" height="12" fill="#fff"/><rect x="140" y="360" width="10" height="12" fill="#fff"/><rect x="154" y="360" width="10" height="12" fill="#fff"/><rect x="168" y="360" width="10" height="12" fill="#fff"/><rect x="182" y="360" width="10" height="12" fill="#fff"/><rect x="196" y="360" width="10" height="12" fill="#fff"/><rect x="210" y="360" width="10" height="12" fill="#fff"/><rect x="224" y="360" width="10" height="12" fill="#fff"/><rect x="238" y="360" width="10" height="12" fill="#fff"/><rect x="252" y="360" width="10" height="12" fill="#fff"/><rect x="266" y="360" width="10" height="12" fill="#fff"/><rect x="280" y="360" width="10" height="12" fill="#fff"/><rect x="294" y="360" width="10" height="12" fill="#fff"/><rect x="308" y="360" width="10" height="12" fill="#fff"/><rect x="322" y="360" width="10" height="12" fill="#fff"/></mask>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes blink{50%{opacity:0}}
      .sweep{animation:sweep 7s linear infinite}
      @keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(420px)}}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @media (prefers-reduced-motion:reduce){.cursor,.sweep,.pulse{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0a0a0c"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>

    <!-- network topology with moving packets -->
    <line x1="66.0" y1="84.0" x2="176.0" y2="64.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="66.0" y1="84.0" x2="118.0" y2="146.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="176.0" y1="64.0" x2="256.0" y2="122.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="118.0" y1="146.0" x2="256.0" y2="122.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="118.0" y1="146.0" x2="64.0" y2="204.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="256.0" y1="122.0" x2="202.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="64.0" y1="204.0" x2="202.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="118.0" y1="146.0" x2="202.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <rect class="pulse" x="60" y="78" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.0s"/>
    <rect x="64" y="82" width="4" height="4" fill="#ffb347"/>
    <rect x="170" y="58" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.4s"/>
    <rect x="174" y="62" width="4" height="4" fill="#ffb347"/>
    <rect class="pulse" x="112" y="140" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.8s"/>
    <rect x="116" y="144" width="4" height="4" fill="#ffb347"/>
    <rect x="250" y="116" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:1.2s"/>
    <rect x="254" y="120" width="4" height="4" fill="#ffb347"/>
    <rect class="pulse" x="58" y="198" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:1.6s"/>
    <rect x="62" y="202" width="4" height="4" fill="#ffb347"/>
    <rect x="196" y="188" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:2.0s"/>
    <rect x="200" y="192" width="4" height="4" fill="#ffb347"/>
    <path id="Lr0" d="M66 84 L118 146 L256 122 L202 194" fill="none" stroke="none"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffc46b" filter="url(#bloom-sm)"><animateMotion dur="4.2s" repeatCount="indefinite" rotate="0"><mpath xlink:href="#Lr0" href="#Lr0"/></animateMotion></rect>
    <path id="Lr1" d="M64 204 L118 146 L66 84 L176 64 L256 122" fill="none" stroke="none"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffc46b" filter="url(#bloom-sm)"><animateMotion dur="5.6s" repeatCount="indefinite" rotate="0"><mpath xlink:href="#Lr1" href="#Lr1"/></animateMotion></rect>
    <path id="Lr2" d="M202 194 L256 122 L176 64 L66 84" fill="none" stroke="none"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffc46b" filter="url(#bloom-sm)"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="0"><mpath xlink:href="#Lr2" href="#Lr2"/></animateMotion></rect>
    <line x1="1214.0" y1="84.0" x2="1104.0" y2="64.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1214.0" y1="84.0" x2="1162.0" y2="146.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1104.0" y1="64.0" x2="1024.0" y2="122.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1162.0" y1="146.0" x2="1024.0" y2="122.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1162.0" y1="146.0" x2="1216.0" y2="204.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1024.0" y1="122.0" x2="1078.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1216.0" y1="204.0" x2="1078.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <line x1="1162.0" y1="146.0" x2="1078.0" y2="194.0" stroke="#ffb347" stroke-opacity=".28" stroke-width="2"/>
    <rect class="pulse" x="1208" y="78" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.0s"/>
    <rect x="1212" y="82" width="4" height="4" fill="#ffb347"/>
    <rect x="1098" y="58" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.4s"/>
    <rect x="1102" y="62" width="4" height="4" fill="#ffb347"/>
    <rect class="pulse" x="1156" y="140" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:0.8s"/>
    <rect x="1160" y="144" width="4" height="4" fill="#ffb347"/>
    <rect x="1018" y="116" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:1.2s"/>
    <rect x="1022" y="120" width="4" height="4" fill="#ffb347"/>
    <rect class="pulse" x="1210" y="198" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:1.6s"/>
    <rect x="1214" y="202" width="4" height="4" fill="#ffb347"/>
    <rect x="1072" y="188" width="12" height="12" fill="#0a0a0c" stroke="#ffb347" stroke-width="2" style="animation-delay:2.0s"/>
